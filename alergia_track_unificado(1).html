function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){notify('No se pudieron guardar los datos en este navegador. Exporta una copia de seguridad.')}updatePatientLabel()}
function updatePatientLabel(){$('patient-label').textContent=state.patientName||'Paciente sin identificar'}
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function applyTheme(t){state.theme=t;document.documentElement.dataset.theme=t;save()}
function nav(){const items=[['log','plus','Registrar'],['history','history','Historial'],['report','chart','Informe'],['settings','settings','Ajustes']];$('nav').innerHTML=items.map(([k,ic,l])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${I(ic)}<span>${l}</span></button>`).join('')}
function head(kicker,title,desc){return `<div class="page-head"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>`}
function cardHead(icon,title,desc=''){return `<div class="card-head"><div class="iconbox">${I(icon)}</div><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div></div>`}
function rangeField(id,label,value=0){return `<div class="field"><label for="${id}">${label}</label><div class="range-row"><input id="${id}" type="range" min="0" max="5" value="${value}" oninput="$('${id}-val').textContent=this.value"><output class="score" id="${id}-val">${value}</output></div><div class="range-labels"><span>0 · Nada</span><span>3 · Moderado</span><span>5 · Muy intenso</span></div></div>`}
function chips(items,chosen){return `<div class="chips">${items.map(s=>`<button type="button" class="chip ${chosen.has(s)?'active':''}" data-sym="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
function render(){updatePatientLabel();nav();const main=$('main');main.classList.remove('view');void main.offsetWidth;main.classList.add('view');main.innerHTML=({log:renderLog,history:renderHistory,report:renderReport,settings:renderSettings})[tab]();}
function renderLog(){const e=editing?state.entries.find(x=>x.id===editing):null;const val=(key,fallback='')=>esc(e?.[key]??fallback);const dt=e?new Date(e.ts):new Date();const dateValue=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);selected=new Set(e?.symptoms||[]);mode=e?.mode||mode;
return head('Diario personal','Registrar síntomas','Anota el episodio con el contexto suficiente para identificar patrones estacionales y compartirlos con tu alergólogo.')+`<div class="card">${cardHead('plus','Tipo de registro','El modo ambiental está seleccionado por defecto.')}
<div class="segmented"><button type="button" class="${mode==='environmental'?'active':''}" data-mode="environmental">${I('leaf')} Ambiental / Polen</button><button type="button" class="${mode==='other'?'active':''}" data-mode="other">${I('eye')} Otras alergias</button></div>
<form id="entry-form"><div id="env-fields" class="${mode==='environmental'?'':'hide'}"><div class="two">${rangeField('respScore','Afectación respiratoria',e?.respScore??0)}${rangeField('eyeScore','Afectación ocular',e?.eyeScore??0)}</div><div class="two">${rangeField('fatigueScore','Fatiga / malestar general',e?.fatigueScore??0)}<div class="field"><label>¿Dónde estabas?</label><div class="context-options">${['Exteriores','Interiores','Ambos'].map(c=>`<button type="button" class="context-btn ${((e?.context||'Exteriores')===c)?'active':''}" data-context="${c}">${c==='Exteriores'?I('sun'):c==='Interiores'?I('history'):I('cloud')}${c}</button>`).join('')}</div><input id="context" type="hidden" value="${val('context','Exteriores')||'Exteriores'}"></div></div><div class="field"><label for="env-trigger">Exposición que sospechas</label><select id="env-trigger"><option value="">No lo sé / sin identificar</option>${['Polen de gramíneas','Polen de olivo','Árboles / plátano de sombra','Polvo / ácaros','Moho / humedad','Contaminación','Mascotas','Césped recién cortado','Otro factor ambiental'].map(t=>`<option ${e?.trigger===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
<div id="other-fields" class="${mode==='other'?'':'hide'}"><div class="field"><label for="triggerType">Tipo de desencadenante</label><select id="triggerType">${['Alimento / posible SAO','Contacto con animal','Agua / ducha','Roce / presión / piel','Medicamento','Picadura','Otro desencadenante'].map(t=>`<option ${e?.triggerType===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="two"><div class="field"><label for="food">Alimento o sustancia (si aplica)</label><input id="food" value="${val('food')}" placeholder="Ej. melocotón, gato, jabón…"></div><div class="field"><label for="preparation">Preparación / estado</label><select id="preparation">${['No aplica','Crudo','Pelado','Cocinado / hervido','Con piel','Sin piel','No lo sé'].map(t=>`<option ${e?.preparation===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="two">${rangeField('otherScore','Intensidad global',e?.int??0)}<div class="field"><label for="otherPlace">Lugar / tipo de contacto</label><input id="otherPlace" value="${val('place')}" placeholder="Ej. casa, exterior, comedor…"></div></div><div class="field"><label for="other-trigger-detail">Desencadenante sospechado</label><input id="other-trigger-detail" value="${val('trigger')}" placeholder="Lo que crees que lo provocó"></div></div>
<div class="divider"></div>${cardHead('eye','Síntomas','Selecciona todos los síntomas presentes. Puedes añadir etiquetas propias en Ajustes.')}
<div id="symptoms-list">${chips(state.customSymptoms,selected)}</div><div class="field"><label for="custom-symptom-entry">Añadir un síntoma solo a este registro</label><div class="two"><input id="custom-symptom-entry" placeholder="Escribe un síntoma…"><button type="button" class="btn secondary" id="add-symptom-entry">Añadir síntoma</button></div></div>
<div class="two"><div class="field"><label for="entryDate">Fecha y hora del episodio</label><input id="entryDate" type="datetime-local" required value="${dateValue}"></div><div class="field"><label for="place">Ubicación / contexto adicional</label><input id="place" value="${val('place')}" placeholder="Casa, parque, universidad…"></div></div>
<div class="field"><div class="switch-row"><div>${I('pill')}<strong>¿Tomaste medicación?</strong><small>Marca si utilizaste antihistamínico u otro tratamiento de rescate.</small></div><div class="med-choice" role="group" aria-label="¿Tomaste medicación?"><button type="button" data-medication-choice="yes" class="${e?.medicationTaken?'active':''}" aria-pressed="${!!e?.medicationTaken}">Sí</button><button type="button" data-medication-choice="no" class="${e&&!e.medicationTaken?'active':!e?'active':''}" aria-pressed="${e?!e.medicationTaken:true}">No</button><input id="medicationTaken" type="checkbox" ${e?.medicationTaken?'checked':''} hidden></div></div></div><div class="field"><label for="medication">Medicación, dosis y hora (si procede)</label><input id="medication" value="${val('medication')}" placeholder="Nombre del medicamento y dosis"></div>
<div class="field"><label for="cause">¿A qué crees que se debe?</label><input id="cause" value="${val('cause')}" placeholder="Hipótesis personal, no causa confirmada"></div><div class="field"><label for="notes">Notas adicionales</label><textarea id="notes" placeholder="Duración, evolución, posibles exposiciones, qué estabas haciendo…">${val('notes')}</textarea></div><div class="btn-row"><button class="btn" type="submit">${I('check')}${editing?'Guardar cambios':'Guardar registro'}</button>${editing?'<button class="btn ghost" type="button" id="cancel-edit">Cancelar</button>':''}</div></form></div>`}
function renderHistory(){const list=[...state.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts));return head('Seguimiento','Historial de síntomas',`${list.length} registros guardados en este dispositivo. Puedes revisar, editar o eliminar cualquier episodio.`)+`<div class="grid"><div class="card span-12"><div class="card-head"><div><h2>Todos los episodios</h2><p>Ordenados del más reciente al más antiguo.</p></div><button class="iconbtn" id="export-history" title="Exportar copia JSON">${I('download')}</button></div><div class="history-list">${list.length?list.map(e=>{const env=e.mode!=='other';const date=new Date(e.ts);return `<article class="entry"><div class="entry-top"><div><span class="tag ${env?'':'other'}">${env?'Ambiental / Polen':'Otras alergias'}</span><div class="entry-title" style="margin-top:8px">${esc(env?`Respiratorio ${e.respScore??e.int??0}/5 · Ocular ${e.eyeScore??0}/5`:e.triggerType||e.trigger||'Episodio específico')}</div><div class="entry-date">${date.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'})} · ${date.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="entry-actions"><button class="iconbtn" data-edit="${esc(e.id)}" title="Editar">${I('edit')}</button><button class="iconbtn" data-delete="${esc(e.id)}" title="Eliminar">${I('trash')}</button></div></div><p><b>Síntomas:</b> ${esc((e.symptoms||[]).join(', ')||'No especificados')}</p><p><b>Contexto:</b> ${esc([e.context,e.place,e.trigger,e.food,e.preparation].filter(Boolean).join(' · ')||'Sin detalles')}<br><b>Intensidad:</b> ${esc(e.int??'—')}/5 · <b>Medicación:</b> ${e.medicationTaken?'Sí':'No'}${e.medication?' · '+esc(e.medication):''}</p>${e.cause?`<p><b>Posible causa (según el paciente):</b> ${esc(e.cause)}</p>`:''}${e.notes?`<p>${esc(e.notes)}</p>`:''}</article>`}).join(''):'<div class="empty">'+I('file')+'<div><b>Aún no hay registros</b></div><p>Tu primer registro aparecerá aquí.</p><button class="btn" style="max-width:240px;margin-top:12px" data-go="log">Registrar síntomas</button></div>'}</div></div></div>`}
function dateRange(){const from=$('report-from')?.value||new Date(new Date().getFullYear(),0,1).toISOString().slice(0,10);const to=$('report-to')?.value||new Date().toISOString().slice(0,10);return{from,to}}
function filtered(){const {from,to}=dateRange();return state.entries.filter(e=>e.ts.slice(0,10)>=from&&e.ts.slice(0,10)<=to).sort((a,b)=>new Date(a.ts)-new Date(b.ts))}
function monthSummary(entries,from,to){const start=new Date(from+'T00:00:00'),end=new Date(to+'T23:59:59');const months=[];let cur=new Date(start.getFullYear(),start.getMonth(),1);while(cur<=end){const first=new Date(Math.max(cur.getTime(),start.getTime())),last=new Date(Math.min(new Date(cur.getFullYear(),cur.getMonth()+1,0,23,59,59).getTime(),end.getTime()));const span=Math.max(1,Math.floor((last-first)/86400000)+1);const env=entries.filter(e=>e.mode!=='other'&&new Date(e.ts)>=first&&new Date(e.ts)<=last);const days=new Set(env.map(e=>e.ts.slice(0,10))).size;const ratio=days/span;let color,label;if(days===0){color='var(--blue)';label='Sin días registrados'}else if(ratio>=.5){color='var(--red)';label='Muy alta'}else if(ratio>=.3){color='var(--orange)';label='Alta'}else if(ratio>=.15){color='var(--yellow)';label='Moderada'}else{color='var(--green)';label='Baja'}months.push({year:cur.getFullYear(),month:cur.getMonth(),name:cur.toLocaleDateString('es-ES',{month:'long',year:'numeric'}),days,span,ratio,color,label,count:env.length});cur=new Date(cur.getFullYear(),cur.getMonth()+1,1)}return months}
function reportMetrics(E){const env=E.filter(e=>e.mode!=='other'),other=E.filter(e=>e.mode==='other'),days=new Set(env.map(e=>e.ts.slice(0,10))).size;const months=monthSummary(E,$('report-from').value,$('report-to').value);const peak=[...months].sort((a,b)=>b.days-a.days)[0];return{env,other,days,months,peak}}
function renderReport(){const now=new Date(),yearStart=`${now.getFullYear()}-01-01`,today=now.toISOString().slice(0,10);const {from,to}=dateRange();return head('Documento para consulta','Informe médico','La primera página prioriza la evolución mensual de síntomas ambientales. El detalle posterior incluye todos los episodios del periodo, también los no ambientales.')+`<div class="grid"><div class="card span-12">${cardHead('file','Configurar informe','Selecciona el intervalo exacto que quieres compartir con tu equipo médico.') }<div class="two"><div class="field"><label for="report-from">Desde</label><input id="report-from" type="date" value="${esc(from||yearStart)}"></div><div class="field"><label for="report-to">Hasta</label><input id="report-to" type="date" value="${esc(to||today)}"></div></div><div class="notice">El resumen mensual cuenta días distintos con síntomas ambientales. Los días sin registro no se interpretan como días sin síntomas. Los colores son un resumen descriptivo, no una medida clínica validada.</div><div class="btn-row"><button class="btn" id="preview-report">${I('file')} Preparar informe / Guardar como PDF</button><button class="btn secondary" id="export-csv">${I('download')} Exportar tabla CSV</button></div></div><div class="card span-12" id="report-preview">${reportPreview(state.entries.filter(e=>e.ts.slice(0,10)>=(from||yearStart)&&e.ts.slice(0,10)<=(to||today)),from||yearStart,to||today)}</div></div>`}
function reportPreview(E,from,to){if(from>to)return '<p class="notice">La fecha inicial debe ser anterior o igual a la fecha final.</p>';const months=monthSummary(E,from,to),env=E.filter(e=>e.mode!=='other'),other=E.filter(e=>e.mode==='other'),days=new Set(env.map(e=>e.ts.slice(0,10))).size;const peak=[...months].sort((a,b)=>b.days-a.days)[0];return `${cardHead('chart','Vista previa del resumen','Esta es la estructura de la primera página del informe.')}<div class="grid"><div class="card span-4 kpi-card"><div class="iconbox">${I('file')}</div><div><div class="kpi">${E.length}</div><div class="kpi-label">Registros en el periodo</div></div></div><div class="card span-4 kpi-card"><div class="iconbox">${I('leaf')}</div><div><div class="kpi">${env.length}</div><div class="kpi-label">Episodios ambientales</div></div></div><div class="card span-4 kpi-card"><div class="iconbox">${I('calendar')}</div><div><div class="kpi">${days}</div><div class="kpi-label">Días ambientales afectados</div></div></div></div><div class="divider"></div><div class="month-list">${months.map(m=>`<div class="month-row"><div><div class="month-name">${esc(m.name)}</div><div class="month-detail">${m.days}/${m.span} días</div></div><div class="month-bar"><span style="width:${Math.max(m.days?3:0,m.ratio*100)}%;background:${m.color}"></span></div><div class="month-level" style="color:${m.color}">${m.label}</div></div>`).join('')}</div><div class="notice">Mes con más días ambientales afectados: <b>${peak&&peak.days?esc(peak.name):'Sin días ambientales registrados'}</b>. Ambiental: ${env.length}; otras alergias: ${other.length}. El informe detallado incluirá todos los registros.</div><div class="notice"><b>Alcance y limitaciones del registro.</b> Es posible que no se hayan registrado todos los síntomas ni todos los días en los que estuvieron presentes. Los recuentos y tendencias constituyen una aproximación basada en la información disponible y deben interpretarse teniendo en cuenta la posible existencia de registros incompletos.</div>`}
function renderSettings(){return head('Preferencias y privacidad','Ajustes','Personaliza la aplicación y gestiona tus datos. Los registros se guardan localmente en este navegador.')+`<div class="grid"><div class="card span-6">${cardHead('settings','Datos del paciente','Estos datos aparecerán en la cabecera del informe.') }<div class="field"><label for="patient-name">Nombre del paciente</label><input id="patient-name" value="${esc(state.patientName)}" placeholder="Nombre y apellidos"></div><div class="field"><label for="patient-contact">Contacto (opcional)</label><input id="patient-contact" value="${esc(state.contact||'')}" placeholder="Teléfono o correo, si quieres incluirlo"></div><button class="btn" style="margin-top:16px" id="save-profile">Guardar datos</button><div class="notice">Evita añadir datos que no quieras compartir con el profesional sanitario. El archivo PDF puede contener información sensible.</div></div><div class="card span-6">${cardHead('sun','Apariencia','Elige una paleta visual.') }<div class="theme-options">${[['light','Clínico', '#f2f5f7','#167c72'],['dark','OLED oscuro','#0a1118','#6bd0bd'],['navy','Navy','#edf1f7','#344f78'],['emerald','Esmeralda','#eef5f0','#23795b']].map(([id,name,bg,ac])=>`<button class="theme-option ${state.theme===id?'active':''}" data-theme-choice="${id}"><div class="theme-swatch" style="background:linear-gradient(135deg,${bg} 50%,${ac} 50%)"></div>${name}</button>`).join('')}</div></div><div class="card span-12">${cardHead('check','Síntomas frecuentes','Añade etiquetas para reutilizarlas al registrar. También puedes quitar las personalizadas.') }<div class="field"><label for="new-symptom-setting">Nueva etiqueta de síntoma</label><div class="two"><input id="new-symptom-setting" placeholder="Ej. opresión torácica"><button class="btn secondary" id="add-symptom-setting">Añadir síntoma</button></div></div><div class="chips" style="margin-top:15px">${state.customSymptoms.map(s=>`<span class="chip active" style="display:inline-flex;align-items:center;gap:7px">${esc(s)}<button type="button" data-remove-symptom="${esc(s)}" aria-label="Eliminar ${esc(s)}" style="border:0;background:none;color:inherit;font-weight:900">×</button></span>`).join('')}</div><div class="notice">Los síntomas que ya están guardados en episodios no se borran al quitar una etiqueta de la lista.</div></div><div class="card span-12">${cardHead('download','Copia de seguridad','Exporta tus datos antes de cambiar de dispositivo o navegador.') }<div class="btn-row"><button class="btn secondary" id="backup-export">${I('download')} Exportar JSON</button><button class="btn secondary" id="backup-import">Importar JSON</button><input id="backup-file" type="file" accept="application/json,.json" class="hide"><button class="btn danger" id="delete-all">${I('trash')} Borrar todos los registros</button></div></div></div>`}
function getFormValue(id){return $(id)?.value?.trim()||''}
function collectSubmit(ev){ev.preventDefault();const dt=$('entryDate').value;if(!dt)return notify('Indica la fecha y hora del episodio.');if(!selected.size)return notify('Selecciona al menos un síntoma.');const env=mode==='environmental';const entry={id:editing||('e-'+Date.now()),ts:new Date(dt).toISOString(),mode,symptoms:[...selected],notes:getFormValue('notes'),medicationTaken:$('medicationTaken').checked,medication:getFormValue('medication'),place:getFormValue('place')||getFormValue('otherPlace'),cause:getFormValue('cause'),int:env?Math.max(+$('respScore').value,+$('eyeScore').value,+$('fatigueScore').value):+$('otherScore').value};if(env){entry.respScore=+$('respScore').value;entry.eyeScore=+$('eyeScore').value;entry.fatigueScore=+$('fatigueScore').value;entry.context=$('context').value;entry.trigger=getFormValue('env-trigger')}else{entry.triggerType=$('triggerType').value;entry.preparation=$('preparation').value;entry.food=getFormValue('food');entry.trigger=getFormValue('other-trigger-detail')||entry.triggerType;entry.int=+$('otherScore').value}if(editing){const i=state.entries.findIndex(x=>x.id===editing);if(i>=0)state.entries[i]=entry;editing=null;notify('Cambios guardados')}else{state.entries.push(entry);notify('Registro guardado correctamente')}save();tab='history';render();window.scrollTo({top:0,behavior:'smooth'})}
function switchMode(next){mode=next;selected=new Set();editing=null;render()}
function startEdit(id){const e=state.entries.find(x=>x.id===id);if(!e)return;editing=id;mode=e.mode||'environmental';selected=new Set(e.symptoms||[]);tab='log';render();window.scrollTo({top:0,behavior:'smooth'})}
function download(name,content,type='application/json'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(`alergiatrack-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2))}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){const E=filtered();const rows=[['Fecha','Hora','Tipo','Síntomas','Desencadenante','Preparación','Intensidad','Lugar','Contexto','Medicación','Detalle medicación','Posible causa','Notas'],...E.map(e=>{const d=new Date(e.ts);return[d.toLocaleDateString('es-ES'),d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),e.mode==='other'?'Otra alergia':'Ambiental',(e.symptoms||[]).join('; '),e.trigger||e.triggerType||'',e.preparation||'',e.int??'',e.place||'',e.context||'',e.medicationTaken?'Sí':'No',e.medication||'',e.cause||'',e.notes||'']})];download(`alergiatrack-registros-${dateRange().from}-${dateRange().to}.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function printReport(){const E=filtered(),{from,to}=dateRange();if(from>to)return notify('Revisa el intervalo de fechas.');if(!E.length)return notify('No hay registros dentro de ese intervalo.');const months=monthSummary(E,from,to),env=E.filter(e=>e.mode!=='other'),other=E.filter(e=>e.mode==='other'),days=new Set(env.map(e=>e.ts.slice(0,10))).size,peak=[...months].sort((a,b)=>b.days-a.days)[0];const fmt=d=>new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});const print=$('print-report');print.innerHTML=`<div class="print-cover"><div class="print-header"><h1>Informe de seguimiento de síntomas alérgicos</h1><p><b>Paciente:</b> ${esc(state.patientName||'No indicado')}</p><p><b>Contacto:</b> ${esc(state.contact||'No indicado')} &nbsp; · &nbsp; <b>Periodo:</b> ${fmt(from)} – ${fmt(to)}</p><p><b>Generado:</b> ${fmt(new Date())}</p></div><div class="print-section"><h2>Resumen ejecutivo</h2><div class="print-metrics"><div class="print-metric"><b>${E.length}</b><span>Registros totales</span></div><div class="print-metric"><b>${env.length}</b><span>Episodios ambientales</span></div><div class="print-metric"><b>${days}</b><span>Días ambientales afectados</span></div><div class="print-metric"><b>${other.length}</b><span>Otras alergias</span></div><div class="print-metric"><b>${E.filter(e=>e.medicationTaken).length}</b><span>Registros con medicación</span></div><div class="print-metric"><b>${peak&&peak.days?esc(peak.name):'—'}</b><span>Mes con más días afectados</span></div></div></div><div class="print-section"><h2>Evolución mensual de síntomas ambientales</h2><div class="print-months">${months.map(m=>`<div class="print-month"><strong><span class="print-dot" style="background:${m.color}"></span>${esc(m.name)}</strong><p><b>${m.days}</b> días con síntomas de ${m.span} días del periodo</p><p>${m.label} · ${m.count} episodios registrados</p></div>`).join('')}</div></div><div class="print-section"><h2>Distribución por tipo de episodio</h2><p>Ambientales: <b>${env.length} (${E.length?Math.round(env.length/E.length*100):0}%)</b> · Otras alergias: <b>${other.length} (${E.length?Math.round(other.length/E.length*100):0}%)</b>.</p></div><div class="print-note"><b>Interpretación de colores:</b> Rojo: síntomas en ≥50% de los días del periodo mensual; naranja: 30–49%; amarillo: 15–29%; verde: >0–14%; azul: no hay días con síntomas ambientales registrados. El azul no demuestra ausencia de síntomas. Un día sin registro no se considera un día sin síntomas. Este resumen es descriptivo y no constituye una escala clínica validada.</div><div class="print-note" style="margin-top:9px"><b>Alcance y limitaciones del registro:</b> Es posible que no se hayan registrado todos los síntomas ni todos los días en los que estuvieron presentes. Por ello, los recuentos, porcentajes y tendencias que se muestran constituyen una aproximación basada exclusivamente en la información disponible y deben interpretarse teniendo en cuenta la posible existencia de registros incompletos.</div><p class="print-footer">Datos autorregistrados por el paciente. Informe descriptivo para apoyar la consulta; no constituye diagnóstico ni sustituye la valoración del especialista.</p></div><div class="print-section"><div class="print-header"><h1>Detalle cronológico de episodios</h1><p>Se incluyen todos los registros del periodo, ambientales y no ambientales.</p><p>Paciente: ${esc(state.patientName||'No indicado')} · ${fmt(from)} – ${fmt(to)}</p></div><table class="print-table"><thead><tr><th style="width:14%">Fecha y hora</th><th style="width:10%">Tipo</th><th style="width:17%">Síntomas</th><th style="width:14%">Desencadenante / preparación</th><th style="width:9%">Intensidad</th><th style="width:12%">Lugar / contexto</th><th style="width:10%">Medicación</th><th style="width:14%">Notas / hipótesis</th></tr></thead><tbody>${E.map(e=>`<tr><td>${new Date(e.ts).toLocaleDateString('es-ES')}<br>${new Date(e.ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</td><td>${e.mode==='other'?'Otra alergia':'Ambiental'}</td><td>${esc((e.symptoms||[]).join(', ')||'—')}</td><td>${esc([e.triggerType||e.trigger,e.food,e.preparation].filter(Boolean).join(' · ')||'—')}</td><td>${esc(e.int??'—')}/5</td><td>${esc([e.place,e.context].filter(Boolean).join(' · ')||'—')}</td><td>${e.medicationTaken?'Sí':'No'}${e.medication?'<br>'+esc(e.medication):''}</td><td>${esc([e.cause?'Posible causa: '+e.cause:'',e.notes].filter(Boolean).join(' · ')||'—')}</td></tr>`).join('')}</tbody></table><p class="print-footer">La relación temporal con un desencadenante no confirma por sí sola causalidad.</p></div>`;document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),1000)}
function init(){load();document.documentElement.dataset.theme=state.theme||'light';updatePatientLabel();render()}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;editing=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.mode){switchMode(t.dataset.mode);return}if(t.dataset.medicationChoice){const yes=t.dataset.medicationChoice==='yes';const input=$('medicationTaken');if(input)input.checked=yes;document.querySelectorAll('[data-medication-choice]').forEach(b=>{const active=b.dataset.medicationChoice===(yes?'yes':'no');b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});return}if(t.dataset.sym){const s=t.dataset.sym;selected.has(s)?selected.delete(s):selected.add(s);t.classList.toggle('active',selected.has(s));return}if(t.dataset.context){$('context').value=t.dataset.context;document.querySelectorAll('[data-context]').forEach(b=>b.classList.toggle('active',b===t));return}if(t.dataset.go){tab=t.dataset.go;render();return}if(t.dataset.edit){startEdit(t.dataset.edit);return}if(t.dataset.delete){if(confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')){state.entries=state.entries.filter(e=>e.id!==t.dataset.delete);save();render();notify('Registro eliminado')}return}if(t.dataset.themeChoice){applyTheme(t.dataset.themeChoice);render();notify('Tema actualizado');return}if(t.dataset.removeSymptom){const s=t.dataset.removeSymptom;state.customSymptoms=state.customSymptoms.filter(x=>x!==s);save();render();return}switch(t.id){case'add-symptom-entry':{const input=$('custom-symptom-entry'),s=input.value.trim();if(!s)return;if(!state.customSymptoms.includes(s))state.customSymptoms.push(s);selected.add(s);$('symptoms-list').innerHTML=chips(state.customSymptoms,selected);input.value='';return}case'cancel-edit':editing=null;selected.clear();render();return;case'preview-report':printReport();return;case'export-csv':exportCSV();return;case'export-history':case'backup-export':exportJSON();notify('Copia de seguridad preparada');return;case'backup-import':$('backup-file').click();return;case'save-profile':state.patientName=getFormValue('patient-name');state.contact=getFormValue('patient-contact');save();notify('Datos del paciente guardados');render();return;case'add-symptom-setting':{const s=getFormValue('new-symptom-setting');if(!s)return notify('Escribe el nombre del síntoma.');if(state.customSymptoms.includes(s))return notify('Ese síntoma ya existe.');state.customSymptoms.push(s);save();render();notify('Síntoma añadido');return}case'delete-all':if(confirm('¿Borrar todos los registros? Esta acción no se puede deshacer. Exporta una copia antes si quieres conservarlos.')){state.entries=[];save();render();notify('Registros eliminados')}return}});
document.addEventListener('submit',ev=>{if(ev.target.id==='entry-form')collectSubmit(ev)});
document.addEventListener('change',ev=>{if(ev.target.id==='report-from'||ev.target.id==='report-to'){const from=$('report-from').value,to=$('report-to').value;$('report-preview').innerHTML=reportPreview(filtered(),from,to)}if(ev.target.id==='backup-file'){const file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!Array.isArray(parsed.entries)||!confirm('Importar esta copia sustituirá los datos actuales. ¿Continuar?'))return;state={...blankState(),...parsed};state.entries=state.entries.map(normalizeEntry);save();render();notify('Copia importada')}catch{notify('El archivo JSON no es válido')} };reader.readAsText(file)} });
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));init();
</script>
